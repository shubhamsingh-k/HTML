<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms
    </h1>

     </div>
<form action="Forms2.html" target="_blank">
<fieldset>
    <legend>Personal Information</legend>
    <label for="full name">Full Name: </label>
<input type="text" id="full name" placeholder="Enter your name" required>

<br>
<br>

<label for="email">Email: </label>
<input type="email" id="email" placeholder="Enter your email" required>

<br>
<br>
<label for="password">Password: </label>
<input type="password" id="password" placeholder="Enter your password" required>
<br>
<br>
<label for="checkbox">I agree to the terms and conditions: </label>
<input type="checkbox" id="checkbox" required>
<br>
<br>
<label for="phone number">Phone Number: </label>
<input type="tel" id="phone number" placeholder="Enter your phone number" required>
<br>
<br>
<label for="gender">Gender: </label>
<label for="male">Male</label>
<input type="radio" id="male" name="gender" required>
<label for="female">Female</label>
<input type="radio" id="female" name="gender" required>
<br>
<br>
<label for="DOB">Date of Birth: </label>
<input type="date" id="DOB" placeholder="Enter your date of birth" required>
<br><br>
<label for="file">File: </label>
<input type="file" id="file" placeholder="Upload a file" >
<br><br>
<label for="city">City: </label>
<select name=" city" id="city" required>
    <option value="New York">New York</option>
    <option value="Los Angeles">Los Angeles</option>
    <option value="Chicago">Chicago</option>
    <option value="Houston">Houston</option>
    <option value="Phoenix">Phoenix</option>
</select>
<br><br>
<button type="submit">Submit form</button>
<br><br>
</form>
</fieldset>
    </div>
</body>
</html>
